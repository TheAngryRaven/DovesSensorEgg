# Basic CI: prove the sketch compiles for the target board, and package a
# drag-and-drop flashable UF2 as a workflow artifact (tools/build-uf2.sh —
# double-tap reset on the pod, copy the .uf2 onto the UF2 drive). Still no
# release pipeline, no OTA manifests, no size gates.
name: compile-sketch

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: xiao-nrf52840
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Seeed nRF52 BSP shells out to adafruit-nrfutil during link to
      # package the .hex into a .zip, even when only compiling — install
      # it before the compile step. (Same note as the DovesDataLogger CI.)
      - name: Install adafruit-nrfutil
        run: pip install --user adafruit-nrfutil

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          # Same XIAO nRF52840 the datalogger uses (plain, not Sense).
          fqbn: Seeeduino:nrf52:xiaonRF52840
          platforms: |
            - name: Seeeduino:nrf52
              source-url: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          libraries: |
            - name: Adafruit GFX Library
            - name: Adafruit SSD1306
            - name: Adafruit SH110X
            - name: Adafruit BusIO
          sketch-paths: |
            - .

  uf2:
    name: uf2 artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Same platform/libraries as the compile job, installed directly so
      # the build script can export binaries; adafruit-nrfutil because the
      # Seeed BSP's post-build hook shells out to it.
      - name: Install platform + libraries
        run: |
          pip install --user adafruit-nrfutil
          arduino-cli config init --additional-urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306" "Adafruit SH110X" "Adafruit BusIO"

      - name: Build UF2
        run: ./tools/build-uf2.sh

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DovesSensorEgg-uf2
          path: build/*.uf2
          if-no-files-found: error
